<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Workouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white p-4">
        <h1 class="text-2xl">Gym Workout Tracking App</h1>
        <nav class="mt-2">
            <a href="index.html" class="mr-4 hover:underline">Home</a>
            <a href="create_profile.html" class="mr-4 hover:underline">Create Profile</a>
            <a href="suggest_plan.html" class="mr-4 hover:underline">Suggest Workout Plan</a>
            <a href="track_workouts.html" class="mr-4 hover:underline">Track Workouts</a>
            <a href="progress_dashboard.html" class="mr-4 hover:underline">Progress Dashboard</a>
            <a href="send_reminders.html" class="hover:underline">Workout Reminders</a>
        </nav>
    </header>
    <main class="p-6">
        <h2 class="text-xl font-semibold">Log Your Workout</h2>
        <form class="mt-4">
            <div>
                <label for="exercise" class="block">Exercise Name:</label>
                <input id="exercise" type="text" class="border rounded p-2 w-full">
            </div>
            <div class="mt-4">
                <label for="sets" class="block">Sets:</label>
                <input id="sets" type="number" class="border rounded p-2 w-full">
            </div>
            <div class="mt-4">
                <label for="reps" class="block">Reps:</label>
                <input id="reps" type="number" class="border rounded p-2 w-full">
            </div>
            <div class="mt-4">
                <label for="weight" class="block">Weight (lbs):</label>
                <input id="weight" type="number" class="border rounded p-2 w-full">
            </div>
            <button type="submit" class="mt-4 bg-blue-600 text-white p-2 rounded">Log Workout</button>
        </form>
    </main>
</body>
</html>
